<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101419">
  <title>歪比巴卜影视</title>
  <script>
    window.WEBHOME_PAGE_OPENED_AT = Date.now();
    if (window.fongmiBridge || window.fm || window.fongmi) {
      document.documentElement.classList.add("fm-native");
    }
  </script>
  <style>
    :root {
      color-scheme: dark;
      --panel-rgb: 76, 88, 98;
      --panel: rgba(var(--panel-rgb), .58);
      --panel-soft: rgba(var(--panel-rgb), .44);
      --panel-strong: rgba(var(--panel-rgb), .82);
      --control: rgba(34, 43, 51, .42);
      --control-active: rgba(48, 61, 70, .58);
      --text: #f4f7fb;
      --muted: rgba(226, 234, 242, .72);
      --line: rgba(255, 255, 255, .2);
      --line-strong: rgba(255, 255, 255, .34);
      --focus-line: rgba(168, 218, 255, .72);
      --focus-line-soft: rgba(168, 218, 255, .42);
      --focus-glow: rgba(96, 165, 250, .24);
      --danger: #f09d9d;
      --radius: 8px;
      --fm-web-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: var(--fm-web-height);
      background: transparent;
      color: var(--text);
      overflow-x: hidden;
    }

    html:not(.fm-native),
    html:not(.fm-native) body {
      background-color: #1a1e24;
      background-image: radial-gradient(circle at 10% 20%, rgba(255,255,255,.03) 0%, transparent 50%);
    }

    body {
      letter-spacing: 0;
      overscroll-behavior-x: none;
    }

    body.detail-active .app {
      visibility: hidden;
      pointer-events: none;
    }

    button, input {
      font: inherit;
      color: inherit;
    }

    button {
      border: 0;
      margin: 0;
      padding: 0;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      cursor: pointer;
      text-align: inherit;
      touch-action: manipulation;
    }

    img {
      display: block;
      max-width: 100%;
      background: rgba(0, 0, 0, .12);
    }

    .app {
      min-height: var(--fm-web-height);
      padding: max(12px, env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom));
      background: transparent;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: center;
      min-height: 42px;
      margin-bottom: 10px;
      padding: 0;
    }

    h1 {
      margin: 0;
      font-size: 17px;
      line-height: 1.15;
      font-weight: 880;
      letter-spacing: 0;
    }

    .sub {
      margin-top: 3px;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .icon {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon-btn, .btn, .chip, .field {
      border-radius: var(--radius);
      background: var(--control);
      border: 1px solid var(--line);
      color: var(--text);
      backdrop-filter: blur(12px) saturate(1.05);
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      transition: background .16s ease, border-color .16s ease, transform .16s ease;
    }

    .btn {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 14px;
      font-size: 14px;
      font-weight: 760;
      text-decoration: none;
    }

    .search {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      min-width: 0;
      margin: 0;
      position: relative;
      z-index: 20;
    }

    .field {
      width: 100%;
      min-width: 0;
      min-height: 42px;
      padding: 0 12px;
      outline: none;
      font-size: 14px;
      background: var(--control);
    }

    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 0 5px;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }

    .chip {
      flex: 0 0 auto;
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 760;
      white-space: nowrap;
    }
    .chip.active {
      background: var(--control-active);
      border-color: var(--line-strong);
      color: var(--text);
    }

    .status {
      min-height: 38px;
      display: none;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: var(--radius);
      background: var(--panel-soft);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }
    .status.show { display: flex; }

    .spinner {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,.16);
      border-top-color: rgba(255,255,255,.76);
      animation: spin .85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
      min-height: 180px;
    }

    .card {
      min-width: 0;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--panel-soft);
      border: 1px solid var(--line);
      color: var(--text);
      text-align: left;
    }

    .thumb {
      position: relative;
      aspect-ratio: 2 / 3;
      overflow: hidden;
      background: rgba(20, 24, 28, .5);
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .thumb.fallback { display: grid; place-items: center; padding: 8px; text-align: center; }
    .thumb.fallback span { color: rgba(255,255,255,.28); font-size: 20px; font-weight: 900; line-height: 1.1; word-break: break-word; }

    .badge {
      position: absolute;
      left: 6px;
      bottom: 6px;
      max-width: calc(100% - 12px);
      padding: 3px 6px;
      border-radius: 6px;
      background: rgba(0,0,0,.52);
      border: 1px solid rgba(255,255,255,.16);
      font-size: 11px;
      font-weight: 820;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-body {
      min-height: 50px;
      padding: 7px;
      background: var(--panel);
    }
    .title {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      font-size: 12px;
      font-weight: 760;
      line-height: 1.25;
      word-break: break-word;
    }
    .meta {
      margin-top: 4px;
      font-size: 11px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty {
      grid-column: 1 / -1;
      min-height: 120px;
      display: grid;
      place-items: center;
      padding: 18px;
      border-radius: var(--radius);
      border: 1px dashed rgba(255, 255, 255, .22);
      background: var(--panel-soft);
      color: var(--muted);
      text-align: center;
    }

    .sheet {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      background: rgba(0,0,0,.85);
      backdrop-filter: blur(8px);
      padding: max(12px, env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom));
      overflow: auto;
    }
    .sheet.active { display: block; }

    .detail {
      min-height: calc(var(--fm-web-height) - 30px);
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 14px;
    }

    .detail-card {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      gap: 14px;
      align-content: start;
      padding: 12px;
      border-radius: var(--radius);
      background: var(--panel-soft);
      border: 1px solid var(--line);
      position: relative;
      overflow: hidden;
    }

    .poster {
      width: 112px;
      aspect-ratio: 2 / 3;
      border-radius: var(--radius);
      overflow: hidden;
      background: rgba(0,0,0,.2);
      border: 1px solid rgba(255,255,255,.12);
    }
    .poster img { width: 100%; height: 100%; object-fit: cover; }

    .detail-title { margin: 0; font-size: 18px; line-height: 1.22; font-weight: 880; word-break: break-word; }
    .detail-tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
    .detail-tag {
      min-height: 26px;
      display: inline-flex;
      align-items: center;
      padding: 0 9px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.14);
      color: var(--muted);
      font-size: 11px;
      font-weight: 720;
    }

    .detail-extra { grid-column: 1 / -1; display: grid; gap: 10px; margin-top: 2px; }
    .detail-section { padding: 11px; border-radius: var(--radius); background: rgba(18, 24, 30, .24); border: 1px solid rgba(255,255,255,.12); }
    .detail-section-title { margin-bottom: 7px; color: var(--text); font-size: 12px; font-weight: 820; }
    .detail-section-text { color: var(--muted); font-size: 13px; line-height: 1.6; word-break: break-word; }

    .episodes { grid-column: 1 / -1; margin-top: 8px; }
    .episodes-title { font-size: 13px; font-weight: 800; margin-bottom: 10px; color: var(--text); }
    .episodes-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .episode-btn {
      min-width: 52px;
      padding: 6px 12px;
      border-radius: 6px;
      background: var(--control);
      border: 1px solid var(--line);
      font-size: 12px;
      font-weight: 600;
      transition: all .16s ease;
    }
    .episode-btn.active { background: var(--control-active); border-color: var(--focus-line); color: #fff; }

    .toast {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(14px + env(safe-area-inset-bottom));
      z-index: 80;
      display: none;
      min-height: 42px;
      align-items: center;
      padding: 10px 12px;
      border-radius: var(--radius);
      background: var(--panel-strong);
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 13px;
    }
    .toast.show { display: flex; }

    .focusable:focus, button:focus, input:focus {
      outline: none;
      border-color: var(--focus-line);
      box-shadow: 0 0 0 1px var(--focus-line-soft), 0 10px 24px rgba(0,0,0,.24), 0 0 18px var(--focus-glow);
      transform: scale(1.02);
      z-index: 10;
    }

    @media (min-width: 560px) {
      .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    }

    @media (min-width: 900px) {
      .grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
      .detail-card { grid-template-columns: 170px minmax(0, 1fr); gap: 18px; padding: 16px; }
      .poster { width: 170px; }
      .detail-title { font-size: 24px; }
      .detail-extra { grid-column: 2; }
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <header class="topbar">
      <form class="search" id="searchForm" autocomplete="off">
        <input class="field focusable" id="searchInput" type="search" placeholder="搜索电影 / 剧集 / 动漫" readonly>
        <button class="icon-btn focusable" type="submit" aria-label="搜索">
          <svg class="icon" viewbox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m21 21-4.3-4.3" /></svg>
        </button>
      </form>
    </header>
    <nav class="chips" id="chips" aria-label="分类"></nav>
    <div class="status" id="status">
      <span class="spinner"></span><span id="statusText">加载中</span>
    </div>
    <section class="grid" id="grid" aria-live="polite"></section>
    <button class="btn more focusable" id="moreBtn" type="button" style="width:100%; margin-top:12px; display:none;">加载更多</button>
  </main>

  <section class="sheet" id="detailSheet" aria-hidden="true">
    <div class="detail">
      <div class="detail-head">
        <button class="icon-btn focusable" id="closeDetailBtn" type="button" aria-label="返回">
          <svg class="icon" viewbox="0 0 24 24"><path d="m15 18-6-6 6-6" /></svg>
        </button>
        <div class="brand">
          <h1>详情</h1>
          <div class="sub" id="detailSub">歪比巴卜</div>
        </div>
      </div>
      <div id="detailBody"></div>
    </div>
  </section>
  
  <div class="toast" id="toast"></div>
  
  <script>
    (function () {
      "use strict";

      const HOST = "https://wbbb1.com";
      const CATS = [
        {"type_id": "1", "type_name": "电影"},
        {"type_id": "2", "type_name": "剧集"},
        {"type_id": "3", "type_name": "动漫"},
        {"type_id": "4", "type_name": "综艺"}
      ];
      const SNAPSHOT_KEY = "wbb_state_v8";
      const PAGE_SIZE = 24;
      
      let state = {
        cat: "1",
        key: "",
        page: 1,
        items: [],
        busy: false,
        hasMore: false,
        detail: null,
        focusKey: "",
        scrollY: 0,
        playSources: [],
        playUrls: [],
        currentSource: 0,
        currentEpisode: 0,
        isLeanback: false
      };
      
      let toastTimer = 0;
      const $ = (id) => document.getElementById(id);

      async function requestHtml(url) {
        if (window.fm && fm.req) {
          try {
            const res = await fm.req(url, { responseType: "text", timeout: 15 });
            if (res.ok) return res.body;
            throw new Error(res.error || `HTTP ${res.status}`);
          } catch (e) {
            console.error("Native request failed:", e);
          }
        }
        const proxyUrl = "https://corsproxy.io/?url=" + encodeURIComponent(url);
        const res = await fetch(proxyUrl);
        if (!res.ok) throw new Error("HTTP " + res.status);
        return await res.text();
      }

      function getResUrl(url) {
        if (!url) return "";
        if (url.startsWith("/")) url = HOST + url;
        if (window.fm && fm.res) {
          return fm.res(url, { headers: { "Referer": HOST + "/" } });
        }
        return url;
      }

      function parseVideoCard(cardHtml) {
        const div = document.createElement("div");
        div.innerHTML = cardHtml;
        const card = div.firstElementChild;
        if (!card) return null;
        const link = card.querySelector("a") || card;
        const href = link.getAttribute("href");
        if (!href) return null;
        const match = href.match(/\/detail\/(\d+)\.html/);
        if (!match) return null;
        const titleEl = card.querySelector(".module-poster-item-title, .module-item-title");
        const imgEl = card.querySelector("img");
        const remarkEl = card.querySelector(".module-item-note, .module-item-text");
        return {
          id: match[1],
          title: titleEl ? titleEl.innerText.trim() : "未知",
          pic: imgEl ? (imgEl.getAttribute("data-original") || imgEl.getAttribute("src") || "") : "",
          remark: remarkEl ? remarkEl.innerText.trim() : ""
        };
      }

      async function fetchCategoryContent(tid, pg) {
        const url = pg === 1 ? `${HOST}/type/${tid}.html` : `${HOST}/type/${tid}/${pg}.html`;
        const html = await requestHtml(url);
        const doc = new DOMParser().parseFromString(html, "text/html");
        const items = [];
        doc.querySelectorAll(".module-items .module-item, .module-items a.module-poster-item").forEach(card => {
          const item = parseVideoCard(card.outerHTML);
          if (item) items.push(item);
        });
        return { list: items };
      }

      async function fetchSearchContent(key, pg) {
        const url = pg === 1 ? `${HOST}/search/${encodeURIComponent(key)}-------------.html` : `${HOST}/search/${encodeURIComponent(key)}----------${pg}---.html`;
        const html = await requestHtml(url);
        const doc = new DOMParser().parseFromString(html, "text/html");
        const items = [];
        doc.querySelectorAll(".module-items .module-item, .module-items a.module-poster-item").forEach(card => {
          const item = parseVideoCard(card.outerHTML);
          if (item) items.push(item);
        });
        return { list: items };
      }

      async function fetchDetailContent(vodId) {
        const url = `${HOST}/detail/${vodId}.html`;
        const html = await requestHtml(url);
        const doc = new DOMParser().parseFromString(html, "text/html");
        
        const title = doc.querySelector(".module-info-heading h1")?.innerText.trim() || "";
        const pic = doc.querySelector(".module-info-poster img")?.getAttribute("data-original") || doc.querySelector(".module-info-poster img")?.getAttribute("src") || "";
        const desc = doc.querySelector(".module-info-introduction-content p")?.innerText.trim() || "";
        
        let director = "", actor = "";
        doc.querySelectorAll(".module-info-item").forEach(item => {
          const label = item.querySelector(".module-info-item-title")?.innerText || "";
          const content = item.querySelector(".module-info-item-content")?.innerText || "";
          if (label.includes("导演")) director = content;
          if (label.includes("主演")) actor = content;
        });

        const playSources = [];
        const playUrls = [];
        
        const tabs = doc.querySelectorAll(".module-tab-item");
        const lists = doc.querySelectorAll(".module-list.tab-list, .module-play-list, .module-list.sort-list.tab-list");
        
        if (tabs.length > 0 && lists.length >= tabs.length) {
          tabs.forEach((tab, i) => {
            const sourceName = tab.getAttribute("data-dropdown-value") || tab.innerText.trim();
            const episodes = [];
            const listContainer = lists[i];
            listContainer.querySelectorAll("a").forEach(link => {
              const href = link.getAttribute("href");
              if (href && (href.includes("/play/") || link.classList.contains("module-play-list-link"))) {
                episodes.push({ name: link.innerText.trim(), url: href });
              }
            });
            if (episodes.length) {
              playSources.push(sourceName);
              playUrls.push(episodes);
            }
          });
        }
        
        if (playSources.length === 0) {
          const allPlayLists = doc.querySelectorAll(".module-play-list-content, .module-list, .playlist");
          allPlayLists.forEach((list, idx) => {
            const episodes = [];
            list.querySelectorAll("a").forEach(link => {
              const href = link.getAttribute("href");
              if (href && (href.includes("/play/") || link.classList.contains("module-play-list-link"))) {
                episodes.push({ name: link.innerText.trim(), url: href });
              }
            });
            if (episodes.length) {
              playSources.push(`线路 ${idx + 1}`);
              playUrls.push(episodes);
            }
          });
        }
        
        return { vod_id: vodId, vod_name: title, vod_pic: pic, vod_content: desc, vod_director: director, vod_actor: actor, play_from: playSources, play_urls: playUrls };
      }

      async function playCurrent() {
        const episodes = state.playUrls[state.currentSource] || [];
        const episode = episodes[state.currentEpisode];
        if (!episode || !episode.url) return toast("没有播放地址");

        const fullUrl = episode.url.startsWith("http") ? episode.url : HOST + episode.url;
        const title = `${state.detail.vod_name} ${episode.name}`;

        if (window.fm && fm.play) {
          toast("正在解析播放地址...");
          try {
            // 增强型预解析逻辑：尝试从播放页面提取真正的视频地址
            const playHtml = await requestHtml(fullUrl);
            const playerMatch = playHtml.match(/player_aaaa\s*=\s*({.*?});/);
            if (playerMatch) {
              const playerData = JSON.parse(playerMatch[1]);
              if (playerData.url) {
                let realUrl = playerData.url;
                // 处理加密或编码的 URL (此处根据常见 CMS 逻辑处理)
                if (playerData.encrypt === "1") realUrl = unescape(realUrl);
                else if (playerData.encrypt === "2") realUrl = unescape(atob(realUrl));
                
                toast("正在调用原生播放器...");
                // 调用 fm.play 时带上真正的 URL，并指定需要嗅探或解析
                return await fm.play(realUrl, { 
                  title: title, 
                  siteKey: (await fm.site()).key,
                  header: { "Referer": fullUrl }
                });
              }
            }
            
            // 如果预解析失败，退回到推送播放页 URL
            toast("预解析失败，推送播放页...");
            await fm.play(fullUrl, { title: title, siteKey: (await fm.site()).key });
          } catch (e) {
            console.error("fm.play failed", e);
            window.open(fullUrl, "_blank");
          }
        } else {
          toast("浏览器环境：尝试直接打开链接");
          window.open(fullUrl, "_blank");
        }
      }

      function renderChips() {
        $("chips").innerHTML = CATS.map(cat => 
          `<button class="chip focusable ${cat.type_id === state.cat && !state.key ? "active" : ""}" type="button" data-cat="${cat.type_id}">${cat.type_name}</button>`
        ).join("");
      }

      function renderCard(item) {
        const pic = getResUrl(item.pic);
        const poster = pic ? `<img src="${pic}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add('fallback');this.remove();">` : "";
        return `
          <button class="card focusable" type="button" data-id="${item.id}" data-key="vod-${item.id}">
            <div class="thumb ${poster ? "" : "fallback"}">${poster || `<span>${item.title.substring(0,4)}</span>`}<div class="badge">${item.remark || "连载"}</div></div>
            <div class="card-body"><div class="title">${item.title}</div><div class="meta">歪比巴卜</div></div>
          </button>`;
      }

      function renderList() {
        if (!state.items.length && !state.busy) {
          $("grid").innerHTML = '<div class="empty">没有找到内容</div>';
        } else {
          $("grid").innerHTML = state.items.map(renderCard).join("");
        }
        $("moreBtn").style.display = (state.hasMore && !state.busy) ? "block" : "none";
      }

      async function loadList(reset) {
        if (state.busy) return;
        if (reset) { state.page = 1; state.items = []; window.scrollTo(0, 0); }
        state.busy = true;
        setStatus("加载中", true);
        renderList();
        
        try {
          const data = state.key ? await fetchSearchContent(state.key, state.page) : await fetchCategoryContent(state.cat, state.page);
          const known = new Set(state.items.map(i => i.id));
          (data.list || []).forEach(item => { if (!known.has(item.id)) state.items.push(item); });
          state.hasMore = (data.list || []).length >= PAGE_SIZE;
        } catch (e) {
          toast("加载失败：" + e.message);
        } finally {
          state.busy = false;
          setStatus("", false);
          renderList();
          saveSnapshot();
        }
      }

      function renderDetail() {
        const detail = state.detail;
        if (!detail) return;
        $("detailSub").textContent = detail.vod_name || "歪比巴卜";
        if (detail.loading) { $("detailBody").innerHTML = '<div class="empty"><span class="spinner"></span>&nbsp;加载详情</div>'; return; }
        
        const pic = getResUrl(detail.vod_pic);
        const episodes = state.playUrls[state.currentSource] || [];
        
        $("detailBody").innerHTML = `
          <article class="detail-card">
            <div class="poster">${pic ? `<img src="${pic}" alt="">` : ""}</div>
            <div class="detail-summary">
              <h2 class="detail-title">${detail.vod_name}</h2>
              <div class="detail-tags">
                ${detail.vod_director ? `<span class="detail-tag">导演：${detail.vod_director}</span>` : ""}
                ${detail.vod_actor ? `<span class="detail-tag">主演：${detail.vod_actor.substring(0, 30)}</span>` : ""}
              </div>
              <div style="margin-top:auto; padding-top:12px;">
                <button class="btn focusable" id="playBtn" style="background:var(--control-active); border-color:var(--line-strong);">
                  <svg class="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>立即播放
                </button>
              </div>
            </div>
            ${detail.vod_content ? `<div class="detail-extra"><section class="detail-section"><div class="detail-section-title">简介</div><div class="detail-section-text">${detail.vod_content}</div></section></div>` : ""}
            ${state.playSources.length > 1 ? `
              <div class="episodes">
                <div class="episodes-title">播放源</div>
                <div class="episodes-list">${state.playSources.map((s, i) => `<button class="episode-btn focusable ${i === state.currentSource ? "active" : ""}" data-source="${i}">${s}</button>`).join("")}</div>
              </div>` : ""}
            <div class="episodes">
              <div class="episodes-title">剧集列表</div>
              <div class="episodes-list">${episodes.length ? episodes.map((ep, i) => `<button class="episode-btn focusable ${i === state.currentEpisode ? "active" : ""}" data-ep="${i}">${ep.name}</button>`).join("") : '<div style="color:var(--muted); font-size:12px; padding:10px;">未找到剧集，请尝试刷新</div>'}</div>
            </div>
          </article>`;
        
        $("playBtn").onclick = playCurrent;
        $("detailBody").querySelectorAll("[data-source]").forEach(btn => {
          btn.onclick = () => { state.currentSource = parseInt(btn.dataset.source); state.currentEpisode = 0; renderDetail(); };
        });
        $("detailBody").querySelectorAll("[data-ep]").forEach(btn => {
          btn.onclick = () => { state.currentEpisode = parseInt(btn.dataset.ep); renderDetail(); playCurrent(); };
        });
      }

      async function openDetail(id) {
        state.detail = { loading: true, vod_id: id };
        renderDetail();
        document.body.classList.add("detail-active");
        $("detailSheet").classList.add("active");
        $("detailSheet").setAttribute("aria-hidden", "false");
        history.pushState({ route: "detail", id }, "", "#detail");
        
        try {
          state.detail = await fetchDetailContent(id);
          state.playSources = state.detail.play_from || [];
          state.playUrls = state.detail.play_urls || [];
          state.currentSource = 0;
          state.currentEpisode = 0;
          renderDetail();
          if (state.isLeanback && window.fm && fm.ui) fm.ui.setToolbar(false);
        } catch (e) {
          state.detail = { error: e.message, vod_id: id };
          renderDetail();
        }
      }

      function closeDetail(fromPop) {
        document.body.classList.remove("detail-active");
        $("detailSheet").classList.remove("active");
        $("detailSheet").setAttribute("aria-hidden", "true");
        if (state.isLeanback && window.fm && fm.ui) fm.ui.setToolbar(true);
        if (!fromPop && location.hash === "#detail") history.back();
        setTimeout(restoreListFocus, 50);
      }

      function saveSnapshot() {
        const data = { time: Date.now(), cat: state.cat, key: state.key, page: state.page, items: state.items, hasMore: state.hasMore, scrollY: window.scrollY, focusKey: state.focusKey };
        if (window.fm && fm.cache) {
          fm.cache.set(SNAPSHOT_KEY, JSON.stringify(data));
        } else {
          localStorage.setItem(SNAPSHOT_KEY, JSON.stringify(data));
        }
      }

      async function restoreSnapshot() {
        try {
          let text = "";
          if (window.fm && fm.cache) {
            text = await fm.cache.get(SNAPSHOT_KEY);
          } else {
            text = localStorage.getItem(SNAPSHOT_KEY) || "";
          }
          if (!text) return false;
          const data = JSON.parse(text);
          if (!data || Date.now() - data.time > 3600000) return false;
          Object.assign(state, data);
          $("searchInput").value = state.key;
          renderChips();
          renderList();
          setTimeout(() => { window.scrollTo(0, state.scrollY); restoreListFocus(); }, 100);
          return true;
        } catch (e) { return false; }
      }

      function focusRemoteTarget(target) {
        if (!target) return;
        target.focus({ preventScroll: true });
        const rect = target.getBoundingClientRect();
        if (rect.top < 20 || rect.bottom > window.innerHeight - 20) target.scrollIntoView({ block: "nearest" });
      }

      function restoreListFocus() {
        let target = state.focusKey ? document.querySelector(`[data-key="${state.focusKey}"]`) : null;
        if (!target) target = $("grid").querySelector(".card") || $("chips").querySelector(".chip.active") || $("chips").querySelector(".chip");
        focusRemoteTarget(target);
      }

      function moveFocus(key) {
        const current = document.activeElement;
        const items = Array.from(document.querySelectorAll(".focusable, button, input")).filter(el => {
          const r = el.getBoundingClientRect();
          return r.width > 0 && r.height > 0 && getComputedStyle(el).visibility !== "hidden" && !el.closest("[aria-hidden='true']");
        });
        if (!items.includes(current)) return focusRemoteTarget(items[0]);

        const curRect = current.getBoundingClientRect();
        const cx = curRect.left + curRect.width / 2, cy = curRect.top + curRect.height / 2;
        let best = null, bestScore = Infinity;

        items.forEach(el => {
          if (el === current) return;
          const r = el.getBoundingClientRect();
          const x = r.left + r.width / 2, y = r.top + r.height / 2;
          const dx = x - cx, dy = y - cy;
          if (key === "ArrowLeft" && dx >= -5) return;
          if (key === "ArrowRight" && dx <= 5) return;
          if (key === "ArrowUp" && dy >= -5) return;
          if (key === "ArrowDown" && dy <= 5) return;
          const score = (key.includes("Left") || key.includes("Right") ? Math.abs(dx) : Math.abs(dy)) * 4 + (key.includes("Up") || key.includes("Down") ? Math.abs(dx) : Math.abs(dy));
          if (score < bestScore) { bestScore = score; best = el; }
        });
        if (best) focusRemoteTarget(best);
      }

      function bindEvents() {
        $("chips").onclick = (e) => { const btn = e.target.closest("[data-cat]"); if (btn) { state.cat = btn.dataset.cat; state.key = ""; $("searchInput").value = ""; renderChips(); loadList(true); } };
        $("grid").onclick = (e) => { const card = e.target.closest("[data-id]"); if (card) { state.focusKey = card.dataset.key; openDetail(card.dataset.id); } };
        $("moreBtn").onclick = () => { state.page++; loadList(false); };
        $("searchForm").onsubmit = (e) => { e.preventDefault(); state.key = $("searchInput").value; state.cat = "1"; renderChips(); loadList(true); $("searchInput").blur(); };
        $("searchInput").onclick = () => $("searchInput").removeAttribute("readonly");
        $("closeDetailBtn").onclick = () => closeDetail(false);
        
        document.addEventListener("keydown", (e) => {
          if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.key)) { e.preventDefault(); moveFocus(e.key); }
          else if (e.key === "Enter") { if (document.activeElement.tagName !== "INPUT") { e.preventDefault(); document.activeElement.click(); } }
          else if (e.key === "Escape" || e.key === "Backspace") { if ($("detailSheet").classList.contains("active")) { e.preventDefault(); closeDetail(false); } }
        });

        window.onpopstate = () => { if (location.hash !== "#detail" && $("detailSheet").classList.contains("active")) closeDetail(true); };
        window.addEventListener("fmsdk", () => {
          if (window.fongmiClient) state.isLeanback = fongmiClient.isLeanback;
          restoreSnapshot(); 
        });
      }

      function setStatus(text, loading) {
        $("statusText").textContent = text;
        $("status").classList.toggle("show", !!text);
        if ($("status").querySelector(".spinner")) $("status").querySelector(".spinner").style.display = loading ? "" : "none";
      }

      function toast(text) {
        clearTimeout(toastTimer);
        $("toast").textContent = text;
        $("toast").classList.add("show");
        toastTimer = setTimeout(() => $("toast").classList.remove("show"), 2400);
      }

      renderChips();
      bindEvents();
      if (!window.fongmiBridge) {
        restoreSnapshot().then(restored => { if (!restored) loadList(true); });
      }
    })();
  </script>
</body>
</html>
