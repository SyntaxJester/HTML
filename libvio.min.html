html_content = '''<!DOCTYPE html>

        /* ===== Top Bar (like nostr) ===== */
        .top-bar {

        .page-title {

        .icon-btn {

        .section-actions {

        /* ===== Connection Dock (nostr style) ===== */
        .connection-dock {
            position: relative;

        .vod-grid {

        /* ===== Vod Card (nostr style) ===== */

            right: 0;

            right: 0;
            bottom: 0;
            left: 0;

        .detail-cover.poster-mode img {

            right: 0;
            bottom: 0;

            height: 100%;

        .detail-info {

        }

        }

        .detail-info h2 {
            margin: 0 0 8px;
            font-size: clamp(22px, 6vw, 32px);
            line-height: 1.12;
        }

        .detail-title-row h2 {

        }

        }

        .detail-block {

        .detail-block h3 {

            font-size: 17px;
            line-height: 1.2;

        /* ===== Episode Grid ===== */

            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        .episode-item {
            min-height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 14px;

            background: var(--panel);
            border: 1px solid var(--line);
            color: var(--text);
            font-size: 13px;
            font-weight: 700;
            text-shadow: 0 1px 2px rgba(0, 0, 0, .38);
            backdrop-filter: blur(10px) saturate(1.05);
            cursor: pointer;
            transition: transform .06s ease, background-color .12s ease, border-color .12s ease;
        }

        .episode-item:focus {
            outline: none;
            transform: translateY(-1px);
            background: rgba(70, 85, 96, .72);
            border-color: var(--focus-line);
            box-shadow: none;
        }

        .episode-item:active {

        }

        /* ===== Disk Item ===== */
        .disk-item {
            width: 100%;
            min-width: 0;
            display: grid;

            align-items: center;
            gap: 10px;

            text-align: left;
            box-shadow: 0 12px 30px rgba(0, 0, 0, .14);
            backdrop-filter: blur(12px) saturate(1.05);
            cursor: pointer;
            transition: transform .06s ease, border-color .12s ease;
        }

        .disk-item:focus {
            outline: none;
            transform: translateY(-1px);
            border-color: var(--focus-line);
        }

        .disk-item:active {
            transform: translateY(1px);
        }

        .disk-info {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .disk-status {

        .disk-name {

        .disk-type {

            border: 1px solid rgba(255, 255, 255, .14);
            white-space: nowrap;
        }

        .part-title {
            font-size: 15px;
            font-weight: 800;
            line-height: 1.2;
            margin: 0 0 10px;
            color: var(--text);
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            left: 50%;
            bottom: max(18px, calc(var(--fm-safe-bottom) + env(safe-area-inset-bottom)));
            z-index: 90;
            transform: translateX(-50%) translateY(24px);
            max-width: calc(100vw - 28px);
            padding: 10px 12px;
            border-radius: var(--radius);
            background: rgba(6, 8, 10, .86);
            border: 1px solid var(--line);
            color: var(--text);
            box-shadow: var(--shadow);
            opacity: 0;
            pointer-events: none;
            transition: .18s ease;
            font-size: 13px;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== Back Top ===== */
        .back-top {
            position: fixed;
            right: max(14px, env(safe-area-inset-right));
            bottom: max(76px, calc(58px + var(--fm-safe-bottom) + env(safe-area-inset-bottom)));
            z-index: 55;
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            border-radius: var(--radius);
            background: rgba(34, 43, 51, .68);
            border: 1px solid var(--line);
            color: var(--text);
            box-shadow: 0 12px 32px rgba(0, 0, 0, .24);
            backdrop-filter: blur(12px) saturate(1.05);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateY(10px);
            transition: opacity .16s ease, transform .16s ease, visibility .16s ease;
            cursor: pointer;
        }

        .back-top.show {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translateY(0);
        }

        .back-top:focus {
            outline: none;
            border-color: var(--focus-line);
        }

        .icon {
            width: 19px;
            height: 19px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .focusable:focus {
            outline: none;
            border-color: var(--focus-line);
            box-shadow: none;
            z-index: 5;
            transition: border-color .06s ease, background-color .06s ease, opacity .06s ease;
        }

        @media (min-width: 720px) {
            .sheet {
                --sheet-x: 34px;
                padding-left: 34px;
                padding-right: 34px;
            }

            .detail-cover {
                width: 100%;
                height: 42vw;
                min-height: 180px;
                max-height: 42vh;
                margin: 14px 0;
                border-radius: var(--radius);
            }
        }

        @media (min-width: 1180px) {
            .sheet {
                --sheet-x: 56px;
                padding-left: 56px;
                padding-right: 56px;
            }
        }
    </style>
</head>
<body>
    <main class="app" id="home">
        <!-- Top Bar: Avatar + Title + Icon Tools -->
        <div class="top-bar">
            <div class="top-bar-left">
                <div class="avatar">
                    <svg viewBox="0 0 24 24" style="width:100%;height:100%;padding:6px;opacity:.6;">
                        <circle cx="12" cy="8" r="4" fill="currentColor"/>
                        <path d="M4 20c0-4 4-6 8-6s8 2 8 6" fill="currentColor"/>
                    </svg>
                </div>
                <div class="page-title">LIBVIO推荐</div>
            </div>
            <div class="top-bar-right">
                <button class="icon-btn focusable" id="btnSearchTop" type="button" aria-label="搜索">
                    <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                </button>
                <button class="icon-btn focusable" id="btnRefresh" type="button" aria-label="刷新">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg>
                </button>
                <button class="icon-btn focusable" id="btnFavorite" type="button" aria-label="收藏">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                </button>
                <button class="icon-btn focusable" id="btnHistory" type="button" aria-label="历史">
                    <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                </button>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="search-bar" id="searchBar">
            <input type="text" id="keywords" class="field focusable" placeholder="搜索关键词" inputmode="search">
            <button id="searchButton" class="btn primary focusable" type="button">
                <svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px;"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                搜索
            </button>
        </div>

        <!-- Category Chips -->
        <nav class="chips" id="categoryBox">
            <button class="chip focusable active" type="button" data-id="home">首页</button>
            <button class="chip focusable" type="button" data-id="1">电影</button>
            <button class="chip focusable" type="button" data-id="2">剧集</button>
            <button class="chip focusable" type="button" data-id="4">番剧</button>
            <button class="chip focusable" type="button" data-id="15">日韩</button>
            <button class="chip focusable" type="button" data-id="16">欧美</button>
        </nav>

        <!-- Section Head with Status Dock -->
        <div class="section-head">
            <h3 id="sectionTitle">LIBVIO推荐</h3>
            <aside class="connection-dock" id="connectionDock">
                <button class="connection-toggle focusable" id="connectionToggle" type="button" aria-expanded="false">
                    <span class="dot ok" id="connectionDot"></span>
                    <span class="connection-title">状态</span>
                    <span class="connection-arrow">⌃</span>
                </button>
            </aside>
        </div>

        <!-- Vod Grid -->
        <div class="vod-grid" id="vodGrid">
            <div class="empty">数据加载中...</div>
        </div>

        <!-- Pagination -->
        <div class="pagination" id="pageBox" style="display:none">
            <button id="btnPrev" class="btn focusable" type="button">上一页</button>
            <span id="txtPage" class="page-text">第 1 页</span>
            <button id="btnNext" class="btn primary focusable" type="button">下一页</button>
        </div>
    </main>

    <!-- Detail Sheet -->
    <section class="sheet" id="detailSheet" aria-hidden="true">
        <button class="btn focusable" id="btnCloseSheet" type="button">
            <svg class="icon" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
            返回
        </button>
        
        <div class="detail-cover poster-mode" id="detailCover">
            <img id="detailImg" src="" alt="">
        </div>
        
        <div class="detail-info">
            <div class="detail-title-row">
                <h2 id="sheetTitle">资源读取中...</h2>
                <span class="detail-title-meta" id="detailTitleMeta"></span>
            </div>
            <div class="detail-meta" id="detailMeta"></div>
            <p id="sheetDesc"></p>
        </div>

        <div class="actions" style="display:flex;gap:10px;flex-wrap:wrap;margin:14px 0;">
            <button class="btn primary focusable" id="detailPlayBtn" type="button">搜索播放</button>
            <button class="btn focusable" id="detailPanBtn" type="button">盘搜</button>
        </div>

        <div id="sourceContainer"></div>
    </section>

    <!-- Toast -->
    <div class="toast" id="toast"></div>
    
    <!-- Back to Top -->
    <button class="back-top focusable" id="backTopBtn" type="button" aria-label="返回顶部">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
    </button>

<script>
    const HOST = 'https://www.libvio.run';
    let currentType = 'home';
    let currentIdx = 1;
    let queryWord = '';
    let preFocusNode = null;

    function verifySdk() {
        if (window.fongmiBridge || window.fm || window.fongmi) {
            document.documentElement.classList.add("fm-native");
        }
    }

    window.addEventListener("fmsdk", verifySdk);
    document.addEventListener("DOMContentLoaded", () => {
        verifySdk();
        requestList();
    });

    async function loadHtml(uri) {
        const url = uri.startsWith('http') ? uri : HOST + uri;
        if (window.fm && window.fm.req) {
            const resp = await fm.req(url, { method: 'GET', responseType: 'text', timeout: 12 });
            if (!resp.ok) throw new Error(`Status ${resp.status}`);
            return resp.body;
        }
        const resp = await fetch(url);
        return await resp.text();
    }

    function safeImg(url) {
        if (!url) return '';
        if (url.startsWith('//')) url = 'https:' + url;
        if (window.fm && window.fm.res) {
            return fm.res(url, { headers: { 'Referer': HOST } });
        }
        return url;
    }

    function parseVods(html) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const items = [];
        const blocks = doc.querySelectorAll('.stui-vodlist__box');
        
        blocks.forEach(b => {
            const node = b.querySelector('a.stui-vodlist__thumb');
            if (node) {
                let img = node.getAttribute('data-original') || node.getAttribute('style') || '';
                if (img.includes('url(')) {
                    const match = img.match(/url\(['"]?(.*?)['"]?)\)/);
                    if (match) img = match[1];
                }
                const score = b.querySelector('.pic-tag-top');
                const remark = b.querySelector('.pic-text');
                items.push({
                    title: node.getAttribute('title') || b.querySelector('.title a')?.innerText || '',
                    href: node.getAttribute('href'),
                    pic: img,
                    tag: score ? score.innerText.trim() : '',
                    note: remark ? remark.innerText.trim() : ''
                });
            }
        });
        return items;
    }

    function parseMeta(html) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const title = doc.querySelector('h1.title')?.innerText || '';
        const poster = doc.querySelector('.vod-poster img')?.getAttribute('data-original') || '';
        const desc = doc.querySelector('.vod-desc .detail-sketch')?.innerText || '';
        
        const lines = [];
        const clouds = [];

        doc.querySelectorAll('.playlist-panel:not(.netdisk-panel)').forEach(p => {
            const label = p.querySelector('h3')?.innerText || '播放列表';
            const eps = [];
            p.querySelectorAll('.stui-content__playlist li a').forEach(a => {
                eps.push({ name: a.innerText.trim(), href: a.getAttribute('href') });
            });
            if (eps.length > 0) lines.push({ name: label, data: eps });
        });

        doc.querySelectorAll('.netdisk-panel .netdisk-item').forEach(p => {
            const tag = p.querySelector('.netdisk-name')?.innerText || '网盘下载';
            const link = p.getAttribute('href');
            if (link) {
                let type = 'http';
                if (link.includes('quark.cn')) type = 'quark';
                else if (link.includes('uc.cn')) type = 'uc';
                else if (link.includes('aliyun.com')) type = 'aliyun';
                else if (link.includes('baidu.com')) type = 'baidu';
                clouds.push({ name: tag, url: link, type: type });
            }
        });

        return { title, poster, desc, lines, clouds };
    }

    function parseMediaLink(html) {
        const match = html.match(/var player_aaaa\s*=\s*(\{.*?\})/);
        if (match && match[1]) {
            try {
                const config = JSON.parse(match[1]);
                return config.url || '';
            } catch (e) {}
        }
        return '';
    }

    async function requestList() {
        const grid = document.getElementById('vodGrid');
        grid.innerHTML = '<div class="empty">数据加载中...</div>';
        
        let path = '/';
        let sectionName = 'LIBVIO推荐';
        if (currentType === 'search') {
            path = `/search/-------------.html?wd=${encodeURIComponent(queryWord)}`;
            document.getElementById('pageBox').style.display = 'none';
            sectionName = `搜索: ${queryWord}`;
        } else if (currentType === 'home') {
            path = '/';
            document.getElementById('pageBox').style.display = 'none';
        } else {
            path = `/type/${currentType}-${currentIdx}.html`;
            document.getElementById('pageBox').style.display = 'flex';
            document.getElementById('txtPage').innerText = `第 ${currentIdx} 页`;
            const chip = document.querySelector(`#categoryBox .chip[data-id="${currentType}"]`);
            sectionName = chip ? chip.innerText : 'LIBVIO推荐';
        }

        document.getElementById('sectionTitle').innerText = sectionName;

        try {
            const html = await loadHtml(path);
            const items = parseVods(html);
            renderGrid(items);
        } catch (e) {
            grid.innerHTML = `<div class="empty">数据加载失败: ${escapeHtml(e.message)}</div>`;
        }
    }

    function escapeHtml(value) {
        return String(value || '').replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function renderGrid(items) {
        const grid = document.getElementById('vodGrid');
        grid.innerHTML = '';
        if (items.length === 0) {
            grid.innerHTML = '<div class="empty">未找到相关资源</div>';
            return;
        }

        items.forEach(item => {
            const card = document.createElement('button');
            card.className = 'card focusable';
            card.type = 'button';
            
            const tag = item.tag && item.tag !== '0.0' ? `<span class="rating-badge">${escapeHtml(item.tag)}</span>` : '';
            const note = item.note ? `<span class="recent-badge">${escapeHtml(item.note)}</span>` : '';
            
            card.innerHTML = `
                <img class="poster" src="${safeImg(item.pic)}" loading="lazy" alt="">
                ${tag}
                ${note}
                <div class="card-body">
                    <div class="card-title">${escapeHtml(item.title)}</div>
                </div>
            `;
            
            card.addEventListener('click', () => openDetails(item.href));
            grid.appendChild(card);
        });
    }

    async function openDetails(url) {
        preFocusNode = document.activeElement;
        document.body.classList.add('detail-active');
        
        const sheet = document.getElementById('detailSheet');
        sheet.classList.add('active');
        sheet.setAttribute('aria-hidden', 'false');
        
        const title = document.getElementById('sheetTitle');
        const desc = document.getElementById('sheetDesc');
        const img = document.getElementById('detailImg');
        const cover = document.getElementById('detailCover');
        const box = document.getElementById('sourceContainer');
        const meta = document.getElementById('detailMeta');
        const titleMeta = document.getElementById('detailTitleMeta');
        
        title.innerText = '资源读取中...';
        desc.innerText = '';
        img.src = '';
        meta.innerHTML = '';
        titleMeta.innerHTML = '';
        cover.style.setProperty('--detail-cover-bg', 'none');
        cover.classList.add('poster-mode');
        box.innerHTML = '<div class="empty">详情加载中...</div>';

        document.getElementById('btnCloseSheet').focus();

        try {
            const html = await loadHtml(url);
            const data = parseMeta(html);

            title.innerText = data.title;
            desc.innerText = data.desc;
            
            const posterUrl = safeImg(data.poster);
            if (posterUrl) {
                img.src = posterUrl;
                cover.style.setProperty('--detail-cover-bg', `url("${posterUrl}")`);
            }
            
            // Build meta pills
            const metaItems = [];
            if (data.lines.length > 0) {
                const totalEps = data.lines.reduce((sum, line) => sum + line.data.length, 0);
                metaItems.push({ text: `${totalEps} 集`, strong: true });
            }
            if (data.clouds.length > 0) {
                metaItems.push({ text: `${data.clouds.length} 个网盘`, strong: false });
            }
            meta.innerHTML = metaItems.map(m => `<span class="meta-pill${m.strong ? ' strong' : ''}">${escapeHtml(m.text)}</span>`).join('');
            
            box.innerHTML = '';

            if (data.clouds.length > 0) {
                const part = document.createElement('div');
                part.className = 'detail-block';
                part.innerHTML = `<h3 class="part-title">网盘下载</h3>`;
                const list = document.createElement('div');
                
                data.clouds.forEach(c => {
                    const item = document.createElement('button');
                    item.className = 'disk-item focusable';
                    item.type = 'button';
                    item.innerHTML = `
                        <div class="disk-info">
                            <div class="disk-status" id="pan_${btoa(c.url).replace(/=/g,'')}"></div>
                            <span class="disk-name">${escapeHtml(c.name)}</span>
                        </div>
                        <span class="disk-type">${c.type.toUpperCase()}</span>
                    `;
                    
                    const triggerPlay = () => {
                        if (window.fm && window.fm.pan && window.fm.pan.play) {
                            fm.pan.play({ type: c.type, url: c.url, title: data.title });
                        } else {
                            window.open(c.url);
                        }
                    };
                    item.addEventListener('click', triggerPlay);
                    list.appendChild(item);
                });
                part.appendChild(list);
                box.appendChild(part);
                triggerPanCheck(data.clouds);
            }

            data.lines.forEach(line => {
                const part = document.createElement('div');
                part.className = 'detail-block';
                part.innerHTML = `<h3 class="part-title">${escapeHtml(line.name)}</h3>`;
                
                const list = document.createElement('div');
                list.className = 'episode-grid';
                
                line.data.forEach(ep => {
                    const item = document.createElement('button');
                    item.className = 'episode-item focusable';
                    item.type = 'button';
                    item.innerText = ep.name;
                    
                    const startPlay = async () => {
                        const originalText = item.innerText;
                        item.innerText = '解析中...';
                        try {
                            const phtml = await loadHtml(ep.href);
                            const streamUrl = parseMediaLink(phtml);
                            item.innerText = originalText;
                            if (streamUrl) {
                                if (window.fm && window.fm.play) {
                                    fm.play(streamUrl, `${data.title} - ${ep.name}`, {
                                        headers: {
                                            'Referer': HOST + '/',
                                            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
                                        }
                                    });
                                } else {
                                    toast(`解析直链成功: ${streamUrl}`);
                                }
                            } else {
                                toast('未找到有效的媒体播放直链');
                            }
                        } catch (err) {
                            item.innerText = originalText;
                            toast('解析失败');
                        }
                    };
                    item.addEventListener('click', startPlay);
                    list.appendChild(item);
                });
                part.appendChild(list);
                box.appendChild(part);
            });

        } catch (e) {
            box.innerHTML = `<div class="empty">详情加载失败: ${escapeHtml(e.message)}</div>`;
        }
    }

    function closeDetails() {
        document.body.classList.remove('detail-active');
        const sheet = document.getElementById('detailSheet');
        sheet.classList.remove('active');
        sheet.setAttribute('aria-hidden', 'true');
        
        const cover = document.getElementById('detailCover');
        const img = document.getElementById('detailImg');
        img.src = '';
        cover.style.setProperty('--detail-cover-bg', 'none');
        
        if (preFocusNode) {
            preFocusNode.focus({ preventScroll: true });
            preFocusNode.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }

    document.getElementById('btnCloseSheet').addEventListener('click', closeDetails);

    async function triggerPanCheck(clouds) {
        if (!window.fm || !window.fm.config || !window.fm.pan || !window.fm.pan.check) return;
        try {
            const conf = await fm.config();
            if (!conf.driveCheck) return;

            const targets = clouds.map(c => ({ type: c.type, url: c.url, password: "" }))
                                  .filter(t => ['quark', 'uc', 'aliyun', 'baidu'].includes(t.type));
            if (targets.length === 0) return;

            const resp = await fm.pan.check(targets);
            if (resp && resp.results) {
                resp.results.forEach(r => {
                    const dot = document.getElementById(`pan_${btoa(r.url).replace(/=/g,'')}`);
                    if (dot) dot.className = `disk-status ${r.state}`;
                });
            }
        } catch (e) {}
    }

    // Category tabs
    document.querySelectorAll('#categoryBox .chip').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('#categoryBox .chip').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            currentType = tab.getAttribute('data-id');
            currentIdx = 1;
            requestList();
        });
    });

    // Pagination
    document.getElementById('btnPrev').addEventListener('click', () => {
        if (currentIdx > 1) {
            currentIdx--;
            requestList();
        }
    });
    document.getElementById('btnNext').addEventListener('click', () => {
        currentIdx++;
        requestList();
    });

    // Search
    function startSearch() {
        const val = document.getElementById('keywords').value.trim();
        if (!val) return;
        queryWord = val;
        currentType = 'search';
        document.querySelectorAll('#categoryBox .chip').forEach(t => t.classList.remove('active'));
        requestList();
    }
    
    document.getElementById('searchButton').addEventListener('click', startSearch);
    document.getElementById('keywords').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') startSearch();
    });

    // Top bar icons
    document.getElementById('btnRefresh').addEventListener('click', () => {
        requestList();
        toast('已刷新');
    });
    document.getElementById('btnSearchTop').addEventListener('click', () => {
        document.getElementById('keywords').focus();
    });
    document.getElementById('btnFavorite').addEventListener('click', () => {
        if (window.fm && window.fm.openKeep) {
            fm.openKeep();
        } else {
            toast('请在 App 中打开收藏');
        }
    });
    document.getElementById('btnHistory').addEventListener('click', () => {
        if (window.fm && window.fm.history) {
            fm.history();
        } else {
            toast('请在 App 中查看历史');
        }
    });

    // Connection dock toggle
    document.getElementById('connectionToggle').addEventListener('click', () => {
        const dock = document.getElementById('connectionDock');
        dock.classList.toggle('open');
    });

    // Toast
    function toast(message) {
        const el = document.getElementById('toast');
        el.textContent = message || '';
        el.classList.add('show');
        clearTimeout(toast.timer);
        toast.timer = setTimeout(() => el.classList.remove('show'), 2200);
    }

    // Back to top
    function updateBackTop() {
        const top = window.scrollY || document.documentElement.scrollTop || 0;
        document.getElementById('backTopBtn').classList.toggle('show', top > window.innerHeight);
    }
    
    document.getElementById('backTopBtn').addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        setTimeout(updateBackTop, 260);
    });

    window.addEventListener('scroll', updateBackTop, { passive: true });

    // Keyboard & remote control (nostr style)
    window.addEventListener('keydown', (e) => {
        const key = e.key;
        
        if (key === 'Escape' || key === 'Backspace') {
            if (document.body.classList.contains('detail-active')) {
                closeDetails();
                e.preventDefault();
                e.stopImmediatePropagation();
                return;
            }
            if (window.fm && window.fm.back) {
                fm.back();
            }
        }
        
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(key)) {
            const active = document.activeElement;
            if (!active || active.tagName === 'BODY') {
                const first = document.querySelector('.focusable');
                if (first) {
                    e.preventDefault();
                    first.focus();
                }
                return;
            }
            
            const all = Array.from(document.querySelectorAll('.focusable')).filter(el => {
                if (el.disabled) return false;
                const style = window.getComputedStyle(el);
                return style.display !== 'none' && style.visibility !== 'hidden';
            });
            
            const idx = all.indexOf(active);
            if (idx < 0) return;
