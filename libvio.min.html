<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LIBVIO WebHome</title>
    <style>
        :root {
            /* NOSTR-inspired refined color system */
            --panel-rgb: 76, 88, 98;
            --panel: rgba(var(--panel-rgb), .58);
            --panel-soft: rgba(var(--panel-rgb), .44);
            --panel-strong: rgba(var(--panel-rgb), .82);
            --panel-2: rgba(var(--panel-rgb), .62);

            --bg: transparent;
            --text: #f4f7fb;
            --muted: rgba(226, 234, 242, .72);
            --line: rgba(255, 255, 255, .2);
            --line-strong: rgba(255, 255, 255, .34);

            --control: rgba(34, 43, 51, .42);
            --control-active: rgba(48, 61, 70, .58);

            --accent: rgba(245, 249, 252, .86);
            --accent-2: rgba(221, 232, 241, .66);
            --accent-gold: #f5c518;

            --focus-line: rgba(168, 218, 255, .72);
            --focus-line-soft: rgba(168, 218, 255, .42);
            --focus-glow: rgba(96, 165, 250, .24);
            --focus-surface: rgba(255, 255, 255, .12);

            --ok: #9fd8ad;
            --danger: #f09d9d;
            --warn: #ffcc4d;

            --shadow: 0 16px 42px rgba(0, 0, 0, .24);
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, .16);
            --shadow-lg: 0 24px 64px rgba(0, 0, 0, .32);

            --radius: 8px;
            --radius-sm: 6px;
            --radius-lg: 10px;

            --fm-web-height: 100vh;
            --fm-safe-bottom: 20px;

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        @supports (height: 100dvh) {
            :root { --fm-web-height: 100dvh; }
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            min-height: var(--fm-web-height);
            background: transparent;
            color: var(--text);
            overflow-x: hidden;
        }

        html:not(.fm-native),
        html:not(.fm-native) body {
            background-color: #1a1f24;
            background-image:
                linear-gradient(45deg, rgba(255, 255, 255, .04) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(255, 255, 255, .04) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(255, 255, 255, .04) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(255, 255, 255, .04) 75%);
            background-position: 0 0, 0 16px, 16px -16px, -16px 0;
            background-size: 32px 32px;
        }

        html.fm-native,
        html.fm-native body {
            background: transparent;
        }

        body {
            position: relative;
            overscroll-behavior-x: none;
            letter-spacing: 0;
        }

        body.detail-active .app {
            visibility: hidden;
            pointer-events: none;
        }

        /* Focus states - NOSTR style */
        .focusable:focus,
        button:focus,
        input:focus {
            outline: none;
            border-color: var(--focus-line);
            box-shadow: 0 0 0 3px var(--focus-glow);
            z-index: 5;
            transition: border-color .12s ease, box-shadow .12s ease, background-color .12s ease, transform .12s ease;
        }

        .focusable:not(.back-top):focus,
        button:not(.back-top):focus,
        input:focus {
            position: relative;
        }

        .focusable:active,
        button:active {
            transform: translateY(1px);
        }

        /* App container */
        .app {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            min-height: var(--fm-web-height);
            overflow-x: hidden;
            padding: max(12px, env(safe-area-inset-top)) 14px calc(18px + var(--fm-safe-bottom) + env(safe-area-inset-bottom));
            background: transparent;
        }

        /* Header - Glassmorphism */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: var(--panel-soft);
            backdrop-filter: blur(12px) saturate(1.05);
            -webkit-backdrop-filter: blur(12px) saturate(1.05);
            border-radius: var(--radius);
            border: 1px solid var(--line);
            box-shadow: var(--shadow-sm);
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, .38);
        }

        /* Navigation tabs - Pill style */
        .nav-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .nav-tab {
            background: var(--control);
            color: var(--text);
            border: 1px solid var(--line);
            padding: 8px 16px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            text-shadow: 0 1px 2px rgba(0, 0, 0, .38);
            backdrop-filter: blur(12px) saturate(1.05);
            transition: all .16s ease;
        }

        .nav-tab:hover {
            background: var(--control-active);
            border-color: var(--line-strong);
            transform: translateY(-1px);
        }

        .nav-tab.active {
            background: var(--control-active);
            color: var(--accent);
            font-weight: 800;
            border-color: var(--accent-2);
            box-shadow: 0 0 12px rgba(245, 197, 24, .15);
        }

        .nav-tab.active:focus {
            border-color: var(--focus-line);
            box-shadow: 0 0 0 3px var(--focus-glow), 0 0 12px rgba(245, 197, 24, .15);
        }

        /* Search bar */
        .search-bar {
            display: flex;
            gap: 8px;
        }

        .search-input {
            background: var(--control);
            color: var(--text);
            border: 1px solid var(--line);
            padding: 8px 14px;
            border-radius: var(--radius);
            width: 200px;
            font-size: 14px;
            font-weight: 500;
            text-shadow: 0 1px 2px rgba(0, 0, 0, .35);
            backdrop-filter: blur(12px) saturate(1.05);
            transition: all .12s ease;
        }

        .search-input::placeholder {
            color: rgba(226, 234, 242, .5);
        }

        .search-btn {
            background: var(--control-active);
            color: var(--text);
            border: 1px solid var(--line-strong);
            padding: 8px 18px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 14px;
            font-weight: 760;
            text-shadow: 0 1px 2px rgba(0, 0, 0, .38);
            backdrop-filter: blur(12px) saturate(1.05);
            transition: all .16s ease;
        }

        .search-btn:hover {
            background: rgba(70, 85, 96, .72);
            border-color: var(--focus-line);
            transform: translateY(-1px);
        }

        /* Video grid - NOSTR card style */
        .vod-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(142px, 1fr));
            gap: 12px;
            flex: 1;
        }

        .vod-card {
            background: var(--panel-soft);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--line);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            position: relative;
            text-decoration: none;
            color: inherit;
            backdrop-filter: blur(10px) saturate(1.05);
            transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
        }

        .vod-card:hover {
            transform: translateY(-2px) scale(1.015);
            border-color: var(--focus-line-soft);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .2);
        }

        .vod-card:focus {
            transform: translateY(-2px) scale(1.025);
            border-color: var(--focus-line);
            box-shadow: 0 0 0 3px var(--focus-glow), 0 8px 24px rgba(0, 0, 0, .2);
        }

        .vod-card:focus img {
            filter: brightness(1.06) saturate(1.04);
        }

        .vod-thumb-box {
            position: relative;
            width: 100%;
            padding-top: 140%;
            background: rgba(0,0,0,0.18);
        }

        .vod-thumb {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            transition: filter .18s ease;
        }

        .vod-tag {
            position: absolute;
            top: 7px;
            right: 7px;
            background: var(--accent-gold);
            color: #000;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 7px;
            border-radius: 999px;
            box-shadow: 0 2px 8px rgba(0,0,0,.3);
            z-index: 2;
        }

        .vod-remarks {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(6, 9, 12, .72);
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 7px;
            border-radius: 4px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,.1);
        }

        .vod-title {
            padding: 10px;
            font-size: 12px;
            font-weight: 760;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 1px 2px rgba(0, 0, 0, .42);
            line-height: 1.25;
            min-height: 15px;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 25px;
            padding: 10px 0;
        }

        .page-btn {
            background: var(--control);
            color: var(--text);
            border: 1px solid var(--line);
            padding: 8px 20px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 14px;
            font-weight: 760;
            text-shadow: 0 1px 2px rgba(0, 0, 0, .38);
            backdrop-filter: blur(12px) saturate(1.05);
            transition: all .16s ease;
        }

        .page-btn:hover {
            background: var(--control-active);
            border-color: var(--line-strong);
            transform: translateY(-1px);
        }

        .page-btn:disabled {
            opacity: .45;
            cursor: not-allowed;
            transform: none;
        }

        .page-text {
            font-size: 14px;
            color: var(--muted);
            font-weight: 600;
            text-shadow: 0 1px 2px rgba(0, 0, 0, .38);
        }

        /* Detail Sheet - NOSTR style */
        .layer-sheet {
            position: fixed;
            inset: 0;
            background: transparent;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .sheet-body {
            background: var(--panel-strong);
            backdrop-filter: blur(20px) saturate(1.08);
            -webkit-backdrop-filter: blur(20px) saturate(1.08);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 860px;
            max-height: 90vh;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            gap: 18px;
            scrollbar-width: none;
        }

        .sheet-body::-webkit-scrollbar { display: none; }

        .sheet-main {
            display: flex;
            gap: 20px;
        }

        .sheet-poster {
            width: 140px;
            height: 196px;
            object-fit: cover;
            border-radius: var(--radius);
            border: 1px solid var(--line);
            flex-shrink: 0;
            box-shadow: var(--shadow-sm);
        }

        .sheet-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 0;
        }

        .sheet-title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }

        .sheet-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--accent);
            margin: 0;
            line-height: 1.2;
            text-shadow: 0 1px 2px rgba(0, 0, 0, .38);
        }

        .sheet-close {
            background: var(--control);
            color: var(--text);
            border: 1px solid var(--line);
            padding: 6px 14px;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 13px;
            font-weight: 760;
            text-shadow: 0 1px 2px rgba(0, 0, 0, .38);
            backdrop-filter: blur(12px) saturate(1.05);
            transition: all .16s ease;
            flex-shrink: 0;
        }

        .sheet-close:hover {
            background: var(--control-active);
            border-color: var(--line-strong);
            transform: translateY(-1px);
        }

        .sheet-desc {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.6;
            max-height: 110px;
            overflow-y: auto;
            scrollbar-width: none;
        }

        .sheet-desc::-webkit-scrollbar { display: none; }

        /* Part titles */
        .part-title {
            font-size: 14px;
            font-weight: 800;
            color: #fff;
            border-left: 3px solid var(--accent-gold);
            padding-left: 10px;
            margin-bottom: 10px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, .38);
        }

        /* Episode grid */
        .episode-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        .episode-item {
            background: var(--control);
            color: var(--text);
            border: 1px solid var(--line);
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            min-width: 60px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, .38);
            backdrop-filter: blur(12px) saturate(1.05);
            transition: all .16s ease;
        }

        .episode-item:hover {
            background: var(--control-active);
            border-color: var(--line-strong);
            transform: translateY(-1px);
        }

        .episode-item:focus {
            border-color: var(--focus-line);
            box-shadow: 0 0 0 3px var(--focus-glow);
            background: rgba(70, 85, 96, .72);
        }

        .episode-item:active {
            transform: translateY(1px);
        }

        /* Disk items */
        .disk-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--control);
            border: 1px solid var(--line);
            padding: 10px 14px;
            border-radius: var(--radius);
            margin-bottom: 8px;
            cursor: pointer;
            backdrop-filter: blur(12px) saturate(1.05);
            transition: all .16s ease;
        }

        .disk-item:hover {
            background: var(--control-active);
            border-color: var(--line-strong);
            transform: translateY(-1px);
        }

        .disk-item:focus {
            border-color: var(--focus-line);
            box-shadow: 0 0 0 3px var(--focus-glow);
            background: rgba(70, 85, 96, .72);
        }

        .disk-item:active {
            transform: translateY(1px);
        }

        .disk-info {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .disk-status {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: rgba(255,255,255,.3);
            flex-shrink: 0;
            box-shadow: 0 0 0 1px rgba(255,255,255,.18);
        }

        .disk-status.ok { 
            background: var(--ok); 
            box-shadow: 0 0 6px var(--ok), 0 0 0 1px rgba(255,255,255,.18);
        }
        .disk-status.bad { 
            background: var(--danger); 
            box-shadow: 0 0 0 1px rgba(255,255,255,.18);
        }
        .disk-status.locked { 
            background: var(--warn); 
            box-shadow: 0 0 0 1px rgba(255,255,255,.18);
        }

        .status-msg {
            text-align: center;
            padding: 40px;
            color: var(--muted);
            font-size: 14px;
            font-weight: 600;
        }

        /* Responsive */
        @media (min-width: 720px) {
            .app {
                padding-left: 34px;
                padding-right: 34px;
            }

            .vod-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 14px;
            }

            .header {
                padding: 14px 20px;
            }

            .search-input {
                width: 240px;
            }
        }

        @media (min-width: 1180px) {
            .app {
                padding-left: 56px;
                padding-right: 56px;
            }

            .vod-grid {
                grid-template-columns: repeat(auto-fill, minmax(176px, 1fr));
                gap: 16px;
            }
        }

        @media (max-width: 480px) {
            .header {
                flex-direction: column;
                align-items: stretch;
            }

            .nav-tabs {
                justify-content: center;
            }

            .search-bar {
                width: 100%;
            }

            .search-input {
                flex: 1;
                width: auto;
            }

            .sheet-main {
                flex-direction: column;
                align-items: center;
            }

            .sheet-poster {
                width: 120px;
                height: 168px;
            }
        }
    </style>
</head>
<body>

<div class="app" id="mainContainer">
    <div class="header">
        <div class="logo">LIBVIO</div>
        <div class="nav-tabs" id="categoryBox">
            <div class="nav-tab focusable active" data-id="home">首页</div>
            <div class="nav-tab focusable" data-id="1">电影</div>
            <div class="nav-tab focusable" data-id="2">剧集</div>
            <div class="nav-tab focusable" data-id="4">番剧</div>
            <div class="nav-tab focusable" data-id="15">日韩</div>
            <div class="nav-tab focusable" data-id="16">欧美</div>
        </div>
        <div class="search-bar">
            <input type="text" id="keywords" class="search-input focusable" placeholder="输入关键字...">
            <button id="searchButton" class="search-btn focusable">搜索</button>
        </div>
    </div>

    <div class="vod-grid" id="vodGrid"></div>

    <div class="pagination" id="pageBox">
        <button id="btnPrev" class="page-btn focusable">上一页</button>
        <span id="txtPage" class="page-text">第 1 页</span>
        <button id="btnNext" class="page-btn focusable">下一页</button>
    </div>
</div>

<div class="layer-sheet" id="detailSheet" style="display: none;">
    <div class="sheet-body">
        <div class="sheet-main">
            <img id="detailImg" class="sheet-poster" src="" alt="">
            <div class="sheet-details">
                <div class="sheet-title-row">
                    <h2 id="sheetTitle" class="sheet-title"></h2>
                    <button class="sheet-close focusable" id="btnCloseSheet">返回</button>
                </div>
                <div id="sheetDesc" class="sheet-desc"></div>
            </div>
        </div>
        <div id="sourceContainer"></div>
    </div>
</div>

<script>
    const HOST = 'https://www.libvio.run';
    let currentType = 'home';
    let currentIdx = 1;
    let queryWord = '';
    let preFocusNode = null;

    function verifySdk() {
        if (window.fongmiBridge || window.fm || window.fongmi) {
            document.documentElement.classList.add("fm-native");
        }
    }

    window.addEventListener("fmsdk", verifySdk);
    document.addEventListener("DOMContentLoaded", () => {
        verifySdk();
        requestList();
    });

    async function loadHtml(uri) {
        const url = uri.startsWith('http') ? uri : HOST + uri;
        if (window.fm && window.fm.req) {
            const resp = await fm.req(url, { method: 'GET', responseType: 'text', timeout: 12 });
            if (!resp.ok) throw new Error(`Status ${resp.status}`);
            return resp.body;
        }
        const resp = await fetch(url);
        return await resp.text();
    }

    function safeImg(url) {
        if (!url) return '';
        if (url.startsWith('//')) url = 'https:' + url;
        if (window.fm && window.fm.res) {
            return fm.res(url, { headers: { 'Referer': HOST } });
        }
        return url;
    }

    function parseVods(html) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const items = [];
        const blocks = doc.querySelectorAll('.stui-vodlist__box');

        blocks.forEach(b => {
            const node = b.querySelector('a.stui-vodlist__thumb');
            if (node) {
                let img = node.getAttribute('data-original') || node.getAttribute('style') || '';
                if (img.includes('url(')) {
                    const match = img.match(/url\(['"]?(.*?)['"]?\)/);
                    if (match) img = match[1];
                }
                const score = b.querySelector('.pic-tag-top');
                const remark = b.querySelector('.pic-text');
                items.push({
                    title: node.getAttribute('title') || b.querySelector('.title a')?.innerText || '',
                    href: node.getAttribute('href'),
                    pic: img,
                    tag: score ? score.innerText.trim() : '',
                    note: remark ? remark.innerText.trim() : ''
                });
            }
        });
        return items;
    }

    function parseMeta(html) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const title = doc.querySelector('h1.title')?.innerText || '';
        const poster = doc.querySelector('.vod-poster img')?.getAttribute('data-original') || '';
        const desc = doc.querySelector('.vod-desc .detail-sketch')?.innerText || '';

        const lines = [];
        const clouds = [];

        doc.querySelectorAll('.playlist-panel:not(.netdisk-panel)').forEach(p => {
            const label = p.querySelector('h3')?.innerText || '播放播放';
            const eps = [];
            p.querySelectorAll('.stui-content__playlist li a').forEach(a => {
                eps.push({ name: a.innerText.trim(), href: a.getAttribute('href') });
            });
            if (eps.length > 0) lines.push({ name: label, data: eps });
        });

        doc.querySelectorAll('.netdisk-panel .netdisk-item').forEach(p => {
            const tag = p.querySelector('.netdisk-name')?.innerText || '网盘下载';
            const link = p.getAttribute('href');
            if (link) {
                let type = 'http';
                if (link.includes('quark.cn')) type = 'quark';
                else if (link.includes('uc.cn')) type = 'uc';
                else if (link.includes('aliyun.com')) type = 'aliyun';
                else if (link.includes('baidu.com')) type = 'baidu';
                clouds.push({ name: tag, url: link, type: type });
            }
        });

        return { title, poster, desc, lines, clouds };
    }

    function parseMediaLink(html) {
        const match = html.match(/var player_aaaa\s*=\s*(\{.*?\})/);
        if (match && match[1]) {
            try {
                const config = JSON.parse(match[1]);
                return config.url || '';
            } catch (e) {}
        }
        return '';
    }

    async function requestList() {
        const grid = document.getElementById('vodGrid');
        grid.innerHTML = '<div class="status-msg">数据加载中...</div>';

        let path = '/';
        if (currentType === 'search') {
            path = `/search/-------------.html?wd=${encodeURIComponent(queryWord)}`;
            document.getElementById('pageBox').style.display = 'none';
        } else if (currentType === 'home') {
            path = '/';
            document.getElementById('pageBox').style.display = 'none';
        } else {
            path = `/type/${currentType}-${currentIdx}.html`;
            document.getElementById('pageBox').style.display = 'flex';
            document.getElementById('txtPage').innerText = `第 ${currentIdx} 页`;
        }

        try {
            const html = await loadHtml(path);
            const items = parseVods(html);
            renderGrid(items);
        } catch (e) {
            grid.innerHTML = `<div class="status-msg">数据加载失败: ${e.message}</div>`;
        }
    }

    function renderGrid(items) {
        const grid = document.getElementById('vodGrid');
        grid.innerHTML = '';
        if (items.length === 0) {
            grid.innerHTML = '<div class="status-msg">未找到相关资源</div>';
            return;
        }

        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'vod-card focusable';
            card.tabIndex = 0;

            let html = `<div class="vod-thumb-box"><img class="vod-thumb" src="${safeImg(item.pic)}" loading="lazy" alt="">`;
            if (item.tag && item.tag !== '0.0') html += `<div class="vod-tag">${item.tag}</div>`;
            if (item.note) html += `<div class="vod-remarks">${item.note}</div>`;
            html += `</div><div class="vod-title">${item.title}</div>`;

            card.innerHTML = html;
            card.onclick = () => openDetails(item.href);
            card.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') openDetails(item.href);
            });
            grid.appendChild(card);
        });
    }

    async function openDetails(url) {
        preFocusNode = document.activeElement;
        document.body.classList.add('detail-active');

        const sheet = document.getElementById('detailSheet');
        sheet.style.display = 'flex';

        const title = document.getElementById('sheetTitle');
        const desc = document.getElementById('sheetDesc');
        const img = document.getElementById('detailImg');
        const box = document.getElementById('sourceContainer');

        title.innerText = '资源读取中...';
        desc.innerText = '';
        img.src = '';
        box.innerHTML = '<div class="status-msg">详情加载中...</div>';

        document.getElementById('btnCloseSheet').focus();

        try {
            const html = await loadHtml(url);
            const meta = parseMeta(html);

            title.innerText = meta.title;
            desc.innerText = meta.desc;
            img.src = safeImg(meta.poster);
            box.innerHTML = '';

            if (meta.clouds.length > 0) {
                const part = document.createElement('div');
                part.className = 'play-group';
                part.innerHTML = `<div class="part-title">网盘下载</div>`;
                const list = document.createElement('div');

                meta.clouds.forEach(c => {
                    const item = document.createElement('div');
                    item.className = 'disk-item focusable';
                    item.tabIndex = 0;
                    item.innerHTML = `<div class="disk-info"><div class="disk-status" id="pan_${btoa(c.url).replace(/=/g,'')}"></div><span>${c.name} [${c.type.toUpperCase()}]</span></div>`;

                    const triggerPlay = () => {
                        if (window.fm && window.fm.pan && window.fm.pan.play) {
                            fm.pan.play({ type: c.type, url: c.url, title: meta.title });
                        } else {
                            window.open(c.url);
                        }
                    };
                    item.onclick = triggerPlay;
                    item.addEventListener('keydown', (e) => { if (e.key === 'Enter') triggerPlay(); });
                    list.appendChild(item);
                });
                part.appendChild(list);
                box.appendChild(part);
                triggerPanCheck(meta.clouds);
            }

            meta.lines.forEach(line => {
                const part = document.createElement('div');
                part.className = 'play-group';
                part.innerHTML = `<div class="part-title">${line.name}</div>`;

                const list = document.createElement('div');
                list.className = 'episode-grid';

                line.data.forEach(ep => {
                    const item = document.createElement('div');
                    item.className = 'episode-item focusable';
                    item.tabIndex = 0;
                    item.innerText = ep.name;

                    const startPlay = async () => {
                        const originalText = item.innerText;
                        item.innerText = '解析中...';
                        try {
                            const phtml = await loadHtml(ep.href);
                            const streamUrl = parseMediaLink(phtml);
                            item.innerText = originalText;
                            if (streamUrl) {
                                if (window.fm && window.fm.play) {
                                    fm.play(streamUrl, `${meta.title} - ${ep.name}`, {
                                        headers: {
                                            'Referer': HOST + '/',
                                            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
                                        }
                                    });
                                } else {
                                    alert(`解析直链成功:
${streamUrl}`);
                                }
                            } else {
                                alert('未找到有效的媒体播放直链');
                            }
                        } catch (err) {
                            item.innerText = originalText;
                        }
                    };
                    item.onclick = startPlay;
                    item.addEventListener('keydown', (e) => { if (e.key === 'Enter') startPlay(); });
                    list.appendChild(item);
                });
                part.appendChild(list);
                box.appendChild(part);
            });

        } catch (e) {
            box.innerHTML = `<div class="status-msg">详情加载失败: ${e.message}</div>`;
        }
    }

    function closeDetails() {
        document.body.classList.remove('detail-active');
        document.getElementById('detailSheet').style.display = 'none';
        if (preFocusNode) {
            preFocusNode.focus({ preventScroll: true });
            preFocusNode.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }

    document.getElementById('btnCloseSheet').onclick = closeDetails;

    async function triggerPanCheck(clouds) {
        if (!window.fm || !window.fm.config || !window.fm.pan || !window.fm.pan.check) return;
        try {
            const conf = await fm.config();
            if (!conf.driveCheck) return;

            const targets = clouds.map(c => ({ type: c.type, url: c.url, password: "" }))
                                  .filter(t => ['quark', 'uc', 'aliyun', 'baidu'].includes(t.type));
            if (targets.length === 0) return;

            const resp = await fm.pan.check(targets);
            if (resp && resp.results) {
                resp.results.forEach(r => {
                    const dot = document.getElementById(`pan_${btoa(r.url).replace(/=/g,'')}`);
                    if (dot) dot.className = `disk-status ${r.state}`;
                });
            }
        } catch (e) {}
    }

    document.querySelectorAll('.nav-tab').forEach(tab => {
        tab.addEventListener('click', (e) => {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            e.target.classList.add('active');
            currentType = e.target.getAttribute('data-id');
            currentIdx = 1;
            requestList();
        });
    });

    document.getElementById('btnPrev').onclick = () => {
        if (currentIdx > 1) {
            currentIdx--;
            requestList();
        }
    };
    document.getElementById('btnNext').onclick = () => {
        currentIdx++;
        requestList();
    };

    function startSearch() {
        const val = document.getElementById('keywords').value.trim();
        if (!val) return;
        queryWord = val;
        currentType = 'search';
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        requestList();
    }
    document.getElementById('searchButton').onclick = startSearch;
    document.getElementById('keywords').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') startSearch();
    });

    window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' || e.key === 'Backspace' || e.keyCode === 27 || e.keyCode === 8) {
            if (document.body.classList.contains('detail-active')) {
                closeDetails();
                e.preventDefault();
                e.stopImmediatePropagation();
            } else if (window.fm && window.fm.back) {
                fm.back();
            }
        }
    });
</script>

</body>
</html>
